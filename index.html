<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a13"><meta name="apple-mobile-web-app-capable" content="yes">
<title>REMNARIA vs Full Power Tear</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest">
</head><body>
<header class="top"><div class="lp"><span>YOU</span><b id="playerLP">8000</b><small>Deck <span id="deckCount">40</span></small></div><div class="turn" id="turnText">TURN 1</div><div class="lp cpu"><span>TEAR CPU</span><b id="cpuLP">8000</b><small>Deck <span id="cpuDeckCount">41</span></small></div></header>
<div id="busy" class="busy">CPU THINKING...</div>
<main>
<section class="zoneBox"><div class="zoneHead"><b>CPU FIELD</b><span>全盛期イシズティアラ</span></div><div id="cpuField" class="cards"></div></section>
<section class="zoneBox"><div class="zoneHead"><b>YOUR FIELD</b><span>REMNARIA</span></div><div id="playerField" class="cards"></div></section>
<section class="zoneBox"><div class="zoneHead"><b>HAND</b><span>カードをタップして行動</span></div><div id="hand" class="cards"></div></section>
<section class="zoneBox"><div class="zoneHead"><div id="resourceTabs" class="tabs" data-tab="grave"><button data-tab="grave" class="active" onclick="setTab('grave')">墓地</button><button data-tab="banished" onclick="setTab('banished')">除外</button><button data-tab="extra" onclick="setTab('extra')">EX</button></div><span></span></div><div id="resourceCards" class="cards"></div></section>
<section class="zoneBox"><div class="zoneHead"><b>DUEL LOG</b><span></span></div><div id="log" class="log"></div></section>
</main>
<nav class="actions">
<button id="alkaBtn" onclick="upper('alka')">アルカ</button><button id="varesBtn" onclick="upper('vares')">ヴァレス</button><button id="eternaBtn" onclick="upper('eterna')">エテルナ</button><button id="battleBtn" class="battle" onclick="startBattle()">BATTLE</button><button id="endBtn" class="primary" onclick="endTurn()">END</button>
</nav>

<div id="choiceOverlay" class="overlay"><div class="modal"><h2 id="choiceTitle">選択</h2><div id="choiceList" class="choiceList"></div><button onclick="closeChoice(-1)">キャンセル</button></div></div>
<div id="confirmOverlay" class="overlay"><div class="modal"><h2 id="confirmText">発動する？</h2><div class="confirmBtns"><button class="yes" onclick="closeConfirm(true)">はい</button><button class="no" onclick="closeConfirm(false)">いいえ</button></div></div></div>
<div id="startOverlay" class="overlay start"><div class="modal"><small>PLAYABLE BETA v1.0</small><h1>REMNARIA<br>vs TEAR</h1><p>レムナリアと全盛期イシズティアラの専用対戦シミュレーター。<br>先攻・後攻を選んで開始。</p><button class="yes" onclick="begin()">デュエル開始</button></div></div>
<div id="winOverlay" class="overlay win"><div class="modal"><div id="winText">YOU WIN</div><button class="yes" onclick="newMatch()">もう一戦</button></div></div>

<script src="app.js"></script></body></html>
